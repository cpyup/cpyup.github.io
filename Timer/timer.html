<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year Up United Timer</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
    </style>
</head>
<body> 
    <header>   
        <nav>
            <ul>
                <li>
                    <a href="https://www.yearup.org/" class="logo" target="_blank"><img src="./images/icons/NewYUU-logo.svg" alt="Year Up United Logo Link"></a>
                </li>
                <li>
                    <p class = "headerTime">9:47 PM EST</p>
                </li>
            </ul>
        </nav>
    </header>
    
    <main>
    <div class="mainContainer">
        
        <div class="clockContainer">
            
            <div class="addTimeButtons">
                <ul>
                    <li>+ 0:30</li>
                    <li>+ 1:00</li>
                    <li>+ 5:00</li>
                </ul>
            </div>

            <div class="clockDisplay">
                00:00:00
            </div>

            <div class="clockControls">
                <ul>
                    <li>Target Time</li>
                    <li>Play</li>
                    <li>Stop</li>
                </ul>
            </div>

        </div>
        
        <div class="menuButtons">
            <ul>
                <li>Timer</li>
                <li>Stopwatch</li>
                <li>Settings</li>
            </ul>
        </div>

    </div>
    </main>
</body>
</html>
