<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year Up United Timer</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap');
    </style>
    <script src="script.js" async></script>
</head>
<body> 
    <header>   
        <nav>
            <ul>
                <li>
                    <a href="https://www.yearup.org/" class="logo" target="_blank"><img src="./images/icons/NewYUU-logo.svg" alt="Year Up United Logo Link"></a>
                </li>
                <li>
                    <p class="headerTime" id="headerTime">00:00:00 PM EST</p>
                </li>
            </ul>
        </nav>
    </header>
    
    <main>
    <div class="mainContainer">
        <div class="clockContainer">
            
            <div class="addTimeButtons">
                <ul>
                    <li><button class="buttons_addTime" type="button" id="addTimeButton1">+0:30</button></li>
                    <li><button class="buttons_addTime" type="button" id="addTimeButton2">+1:00</button></li>
                    <li><button class="buttons_addTime" type="button" id="addTimeButton3">+5:00</button></li>
                </ul>
            </div>

            <div class="clockDisplay">
                <p>00:00:00</p>
            </div>

            <div class="clockControls">
                <ul>
                    <li><button type="timerCtrl" class="targetTime">Target</li>
                    <li><button type="timerCtrl" class="startTime">Start</li>
                    <li><button type="timerCtrl" class="stopTime">Stop</li>
                </ul>
            </div>

        </div>
        
        <!-- NOT YET IMPLEMENTED TODO: ADD BACK ONCE PRESENTATION IS OVER -->
        <!-- <div class="menuButtons">
            <ul>
                <li><button type="menuCtrl" class="Timer">Timer</li>
                <li><button type="menuCtrl" class="Stopwatch">Stopwatch</li>
                <li><button type="menuCtrl" class="Settings">Settings</li>
            </ul>
        </div> -->

    </div>
    </main>
</body>
</html>
