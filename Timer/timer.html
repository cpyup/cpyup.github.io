<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Year Up Timer</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <div id="particles-js">
        <!--- Timer Drop Down Menu --->
        <div class="dropdown">
            <img src="images/timer-icon.png" alt="Menu" class="dropbtn" id="menuIcon">
            <div class="dropdown-content" id="dropdownMenu">
                <a href="#" id="oneMin">1 Minute</a>
                <a href="#" id="fiveMin">5 Minutes</a>
                <a href="#" id="tenMin">10 Minutes</a>
                <a href="#" id="thirtyMin">30 Minutes</a>
				<a href="#" id="oneHour">1 Hour</a>
                <a href="#" id="customTimer">Custom - Minutes</a>
				<a href="#" id="customTarget">Custom - Target</a>
            </div>

        </div>

        <!-- Audio Preload -->
         <audio id="warningAlarm" src="audio/warningAlarm.mp3" preload="auto"></audio>
         <audio id="alarm" src="audio/warningAlarm.mp3" preload="auto"></audio>

        <!-- Fullscreen Icon -->
        <img src="images/full-screen.png" id="fullscreenicon" width="75" height="75" onclick="clickImg(this)" />
        
        <!-- Audio Icons for sound on and mute functionality -->
        <img src="../Timer/images/sound_and_mute_icon-01.png" id="soundIcon" alt="Sound On" width="50" height="50" style="display: block;" />
        <img src="../Timer/images/sound_and_mute_icon-02.png" id="muteIcon" alt="Sound Off" width="50" height="50" style="display: none;" />

        <!--Debug Stopwatch-->
        <!--In order to use, press "Stopwatch Buttons Active:", then press Start. Play/Pause will pause the stopwatch. To resume, press "Start."-->>
            <h2>Stopwatch</h2>
            <div id="stopwatch">00:00:00.000</div>
            <br>
            <button id="stopwatchStatus" onclick="useStopwatch()">Stopwatch Buttons Active: false</button>
            <br>
        </body>
        <br>
        <br>
        <!--Debug Stopwatch-->

        <button id="restart">Restart</button>
        <button id="stop">Stop</button>
        <button id="addMin">+1 Min</button>
        <button id="pause">Play/Pause</button>
        <button id="start">Start</button>
        
    </div>

    <div id="MyClockDisplay" class="clock" onload="showTime()"></div>
    <script src="./script.js"></script>

</body>
</html>
