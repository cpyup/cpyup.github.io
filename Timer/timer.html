<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year Up United Timer</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap');
    </style>
    <script src="js/clock.js"></script>
    <script src="js/TimerInput.js"></script>
    <script src="js/CountDownManager.js"></script>
    <script src="js/Timer.js"></script>
    
    <script src="js/script.js"></script>
</head>
<body> 
    <!-- Audio Preload -->
    <audio id="warningAlarm" src="audio/warningAlarm.mp3" preload="auto"></audio>
    <audio id="alarm" src="audio/alarm.mp3" preload="auto"></audio>
    <header>   
        <nav>
            <ul>
                <li>
                    <a href="https://www.yearup.org/" class="logo" target="_blank"><img src="./images/icons/NewYUU-logo.svg" alt="Year Up United Logo Link"></a>
                </li>
                <li>
                    <p class="headerClock" id="headerClock"></p>
                </li>
            </ul>
        </nav>
    </header>
    
    <main>
        <div class="mainContainer">
            <div class="clockContainer">
                <div class="addTimeButtons">
                    <ul>
                        <button class="menu-dropdown-btn" id="time-zone-button">Time Zone</button>

                        <div id="time-zone-menu" class="menu time-zone-menu" hidden>
                            <div class="time-zone-container">
                                <button id="default" class="time-zone-button">Current</button>
                                <button id="PST" class="time-zone-button">PST</button>
                                <button id="MST" class="time-zone-button">MST</button>
                                <button id="CST" class="time-zone-button">CST</button>
                                <button id="EST" class="time-zone-button">EST</button>
                                <button id="EET" class="time-zone-button">EET</button>
                            </div>
                        </div>
                    </ul>
                </div>

                <div class="mainTimeContainer" >
                    <input type="text" class="mainTimeDisplay" id="mainTimeDisplay" placeholder="HH:MM:SS" autocomplete="off">
                 
                </div>


                <div class="clockControls">
                    <ul>
                        <!-- <li><button type="timerCtrl" class="targetTime" id="customTarget">Target</li> -->
                        <li><button type="timerCtrl" class="startTime" id="start">
                            <svg width="76" height="76" viewBox="-1 0 7 7" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
        
                                <title>play [#1003]</title>
                                <desc>Created with Sketch.</desc>
                                <defs>
                            
                            </defs>
                                <g id="Page-1" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
                                    <g id="Dribbble-Light-Preview" transform="translate(-347.000000, -3766.000000)" fill="white">
                                        <g id="icons" transform="translate(56.000000, 160.000000)">
                                            <path d="M296.494737,3608.57322 L292.500752,3606.14219 C291.83208,3605.73542 291,3606.25002 291,3607.06891 L291,3611.93095 C291,3612.7509 291.83208,3613.26444 292.500752,3612.85767 L296.494737,3610.42771 C297.168421,3610.01774 297.168421,3608.98319 296.494737,3608.57322" id="play-[#1003]">
                            
                            </path>
                                        </g>
                                    </g>
                                </g>
                            </svg>
                            </button>
                        </li>

                        <li><button type="timerCtrl" class="stopTime" id="stop">
                            <svg width="46" height="46" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M2 12C2 7.28595 2 4.92893 3.46447 3.46447C4.92893 2 7.28595 2 12 2C16.714 2 19.0711 2 20.5355 3.46447C22 4.92893 22 7.28595 22 12C22 16.714 22 19.0711 20.5355 20.5355C19.0711 22 16.714 22 12 22C7.28595 22 4.92893 22 3.46447 20.5355C2 19.0711 2 16.714 2 12Z" fill="white"/>
                            </svg>
                            </button>
                        </li>
                    </ul>
                </div>

            </div>
            
            <!-- NOT YET IMPLEMENTED TODO: ADD BACK ONCE PRESENTATION IS OVER -->
            <!-- <div class="menuButtons">
                <ul>
                    <li><button type="menuCtrl" class="Timer">Timer</li>
                    <li><button type="menuCtrl" class="Stopwatch">Stopwatch</li>
                    <li><button type="menuCtrl" class="Settings">Settings</li>
                </ul>
            </div> -->

        </div>
        
        <footer class="bgButtonContainer">
            <ul><button onclick="changeBackground('images/backgrounds/yuuClockBG1NoLogo.png')" class="bgButton1">BG1</button></ul>
            <ul><button onclick="changeBackground('images/backgrounds/yuuClockBG2NoLogo.jpg')" class="bgButton2">BG2</button></ul>
        </footer>
    
    </main>
</body>
</html>
